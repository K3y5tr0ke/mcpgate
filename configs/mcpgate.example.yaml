# mcpgate.example.yaml — annotated reference configuration
# Copy to mcpgate.yaml (or mcpgate.dev.yaml) and adjust values.
# Every option can be overridden with an env var: MCPGATE_<SECTION>.<KEY>
# e.g. MCPGATE_DATABASE.PASSWORD=secret

server:
  host: "0.0.0.0"
  port: 8080
  metrics_port: 9090
  tls:
    enabled: false
    cert_file: ""    # path to TLS certificate PEM
    key_file: ""     # path to TLS private key PEM
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  max_header_bytes: 1048576   # 1 MB

database:
  host: "localhost"
  port: 5432
  name: "mcpgate"
  user: "mcpgate"
  password: ""                 # prefer MCPGATE_DATABASE.PASSWORD env var
  ssl_mode: "prefer"           # disable | allow | prefer | require | verify-ca | verify-full
  max_connections: 25
  max_idle_connections: 5
  connection_max_lifetime: 1h

redis:
  host: "localhost"
  port: 6379
  password: ""                 # prefer MCPGATE_REDIS.PASSWORD env var
  db: 0
  pool_size: 20

auth:
  session_ttl: 1h
  session_sliding: true        # extend TTL on each authenticated request
  session_revalidate_interval: 30s  # how often the audit-log WebSocket re-checks
                                     # session liveness so a revoked session is
                                     # disconnected mid-stream (0 = default 30s)
  jwt:
    issuer: "mcpgate"
    access_token_ttl: 15m
    refresh_token_ttl: 168h    # 7 days
    signing_key_file: ""       # path to RS256 private key PEM (generated by generate-certs.sh)

saml:
  entity_id: "https://mcpgate.example.com/saml"
  acs_url: "https://mcpgate.example.com/auth/saml/acs"
  metadata_url: "https://mcpgate.example.com/auth/saml/metadata"
  certificate_file: ""         # path to SP certificate PEM
  private_key_file: ""         # path to SP private key PEM
  sign_requests: true
  require_encrypted_assertions: false
  attribute_mapping:
    email: "email"
    display_name: "displayName"
    groups: "groups"

proxy:
  default_timeout: 30s
  max_request_size: 10485760   # 10 MB
  connection_pool:
    max_per_server: 50
    idle_timeout: 90s
  circuit_breaker:
    failure_threshold: 5       # consecutive failures before opening circuit
    recovery_timeout: 30s      # time in open state before half-open probe
    half_open_max_requests: 3  # successful probes needed to close circuit
  health_check:
    interval: 30s
    timeout: 5s

rbac:
  cache_ttl: 30s               # Redis TTL for cached policy decisions
  default_action: "deny"       # deny | allow — deny is the secure default

logging:
  level: "info"                # debug | info | warn | error
  format: "json"               # json | text
  pipeline:
    buffer_size: 10000         # entries in the async channel
    flush_interval: 100ms      # max time between batch writes
    batch_size: 500            # entries per PostgreSQL COPY batch
    writer_count: 4            # parallel writer goroutines
  retention:
    hot_days: 30               # days kept in PostgreSQL hot storage
    warm_days: 90              # days kept in compressed file warm storage

rate_limiting:
  enabled: true
  default:
    rpm: 600                   # requests per minute per user
    rpd: 50000                 # requests per day per user
    concurrent_connections: 10

metrics:
  enabled: true
  otlp:
    enabled: false
    endpoint: "localhost:4317"  # OTLP gRPC collector address
    insecure: true              # disable TLS for local collector

admin:
  web_root: "/web"             # path where React build assets are served from
  cors_origin: ""              # set to the admin console origin in production

# Optional: pre-register upstream MCP servers here.
# Servers can also be managed dynamically via the admin console.
servers: []
