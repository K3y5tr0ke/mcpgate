# mcpgate.dev.yaml — local development overrides
# This file is .gitignored. Copy from mcpgate.example.yaml if it's missing.

server:
  host: "127.0.0.1"
  port: 8080
  metrics_port: 9090
  tls:
    enabled: false

database:
  host: "localhost"
  port: 5432
  name: "mcpgate"
  user: "mcpgate"
  password: "devpassword"
  ssl_mode: "disable"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

logging:
  level: "debug"
  format: "text"

rbac:
  default_action: "deny"

metrics:
  enabled: true
  otlp:
    enabled: false

admin:
  web_root: "web/dist"
  cors_origin: "http://localhost:5173"
