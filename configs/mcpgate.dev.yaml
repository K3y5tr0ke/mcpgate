# mcpgate.dev.yaml — local development overrides
# This file is .gitignored. Copy from mcpgate.example.yaml if it's missing.

server:
  host: "127.0.0.1"
  port: 8080
  metrics_port: 9090
  tls:
    enabled: false

database:
  host: "localhost"
  port: 5432
  name: "mcpgate"
  user: "mcpgate"
  password: "devpassword"
  ssl_mode: "disable"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

auth:
  session_ttl: 8h
  session_sliding: true
  jwt:
    issuer: "mcpgate-dev"
    access_token_ttl: 15m
    signing_key_file: ""    # empty = ephemeral RSA key (dev only — tokens lost on restart)

saml:
  entity_id: "http://localhost:8080/auth/saml/metadata"
  acs_url: "http://localhost:8080/auth/saml/acs"
  metadata_url: "http://localhost:8080/auth/saml/metadata"
  attribute_mapping:
    email: "email"
    display_name: "displayName"

logging:
  level: "debug"
  format: "text"

rbac:
  default_action: "deny"

metrics:
  enabled: true
  otlp:
    enabled: false

admin:
  web_root: "web/dist"
  cors_origin: "http://localhost:5173"
