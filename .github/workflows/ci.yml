name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 -short ./internal/...

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcpgate
          POSTGRES_USER: mcpgate
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcpgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MCPGATE_DATABASE.HOST: localhost
      MCPGATE_DATABASE.PORT: 5432
      MCPGATE_DATABASE.NAME: mcpgate
      MCPGATE_DATABASE.USER: mcpgate
      MCPGATE_DATABASE.PASSWORD: testpassword
      MCPGATE_DATABASE.SSL_MODE: disable
      MCPGATE_REDIS.HOST: localhost
      MCPGATE_REDIS.PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install golang-migrate
        run: |
          curl -sSfL \
            https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin migrate

      - name: Run database migrations
        run: |
          migrate \
            -path internal/store/postgres/migrations \
            -database "postgres://mcpgate:testpassword@localhost:5432/mcpgate?sslmode=disable" \
            up

      - name: Run integration tests
        run: go test -race -count=1 -tags=integration ./internal/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/mcpgate ./cmd/mcpgate

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpgate-linux-amd64
          path: bin/mcpgate
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
