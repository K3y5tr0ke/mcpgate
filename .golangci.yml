version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - gocritic
    - exhaustive
    - misspell
    - unconvert
    - unparam
    - bodyclose

formatters:
  enable:
    - gofmt
    - goimports

formatters-settings:
  goimports:
    local-prefixes:
      - github.com/K3y5tr0ke/mcpgate

linters-settings:
  govet:
    enable-all: true

  errcheck:
    check-type-assertions: true

  gosec:
    excludes:
      - G115  # integer overflow: acceptable in controlled internal math

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam
      - rangeValCopy

  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    # Test files: relax errcheck, gosec, unparam
    - path: .*_test\.go
      linters:
        - gosec
        - errcheck
        - unparam

  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  go: "1.26"
